<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>Attendance Records</title>
  <link rel="stylesheet" href="styles.css?v=20260815-3" />
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Attendance Records</h1>
      <p>Published attendance sessions</p>
    </div>
    <button id="refreshBtn" class="btn">Refresh</button>
  </header>

  <main class="shell">
    <aside class="sidebar">
      <div class="side-title">Sessions</div>
      <div id="sessionTabs" class="tabs"></div>
    </aside>

    <section class="content">
      <div id="emptyState" class="empty">
        <h2>No attendance uploaded yet</h2>
        <p>Uploaded sessions will appear here automatically.</p>
      </div>

      <div id="sessionView" class="hidden">
        <div class="session-head">
          <div class="session-copy">
            <h2 id="sessionTitle">Attendance</h2>
            <p id="sessionMeta"></p>
          </div>
          <div class="session-actions">
            <a id="downloadCsv" class="btn secondary" href="#" download>Download CSV</a>
            <button id="deleteSessionBtn" class="btn danger" type="button">Admin Delete</button>
          </div>
        </div>

        <div class="stats" aria-label="Attendance summary">
          <button id="presentStat" class="stat filterable" type="button" data-filter="present" aria-label="Show present students">
            <span id="presentCount">0</span><small>Present</small>
          </button>
          <button id="absentStat" class="stat filterable" type="button" data-filter="absent" aria-label="Show absent students">
            <span id="absentCount">0</span><small>Absent</small>
          </button>
          <div class="stat total-stat">
            <span id="totalCount">0</span><small>Total</small>
          </div>
        </div>

        <div class="filter-hint">Tap <strong>Present</strong> or <strong>Absent</strong> to filter the list.</div>

        <div id="filterBar" class="filter-bar hidden">
          <span id="filterText"></span>
          <button id="clearFilterBtn" type="button">Show all</button>
        </div>

        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>Student Name</th>
                <th>Index Number</th>
                <th>Status</th>
                <th>Timestamp</th>
              </tr>
            </thead>
            <tbody id="attendanceBody"></tbody>
          </table>
        </div>
      </div>
    </section>
  </main>

  <footer>Student Attendance System</footer>
  <script src="app.js?v=20260815-3"></script>
</body>
</html>
